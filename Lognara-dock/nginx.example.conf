# Блок внутри http {}; домен и пути сертификатов замените на свои.
server {
    listen 80;
    server_name dock.liis17.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dock.liis17.com;
    ssl_certificate /etc/letsencrypt/live/dock.liis17.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dock.liis17.com/privkey.pem;

    # Заголовок Origin должен дойти до dock без изменений: по нему проверяются POST и passkey.
    location / {
        proxy_pass http://127.0.0.1:7403;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Поток логов (SSE): без буферизации и с долгим таймаутом чтения.
    location = /api/logs/stream {
        proxy_pass http://127.0.0.1:7403;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Streamable HTTP MCP: proxy request and response bodies without buffering.
    location = /mcp {
        proxy_pass http://127.0.0.1:7403;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # OAuth metadata and endpoints are handled by dock through the HTTP proxy.
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:7403;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://127.0.0.1:7403;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /oauth/ {
        proxy_pass http://127.0.0.1:7403;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

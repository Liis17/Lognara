[package]
name = "lognara-dock"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Веб-интерфейс Lognara: вход по htpasswd и passkey, логи в реальном времени"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
bcrypt = "0.19.3"
fs2 = "0.4"
futures-util = { version = "0.3", default-features = false }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }
webauthn-rs-proto = "0.5"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = ["softpasskey"] }

[package]
name = "lognara-dock"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Веб-интерфейс Lognara: вход по htpasswd и passkey, логи в реальном времени"
publish = false

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

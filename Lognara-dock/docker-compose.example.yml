# Пример для хоста с nginx: dock слушает только loopback, TLS завершает nginx.
# Перед запуском:
#   mkdir -p auth data && sudo chown 1000:1000 auth data
#   htpasswd -B -C 12 -c auth/htpasswd liis
#   в .env: LOGNARA_QUERY_TOKEN=<query-токен core>
#           LOGNARA_CORE_ADMIN_TOKEN=<admin-токен core>
services:
  lognara-dock:
    build: .
    user: "1000:1000"                       # владелец ./auth и ./data на хосте
    environment:
      LOGNARA_DOCK_PUBLIC_URL: https://dock.liis17.com
      LOGNARA_DOCK_LISTEN_ADDR: "0.0.0.0:7403"
      LOGNARA_DOCK_CORE_URL: http://lognara-core:7402
      LOGNARA_DOCK_CORE_TOKEN: ${LOGNARA_QUERY_TOKEN:?Задайте LOGNARA_QUERY_TOKEN}
      LOGNARA_DOCK_CORE_ADMIN_TOKEN: ${LOGNARA_CORE_ADMIN_TOKEN:?Задайте LOGNARA_CORE_ADMIN_TOKEN}
      # Необязательные, указаны значения по умолчанию:
      # LOGNARA_DOCK_RP_ID: dock.liis17.com
      # LOGNARA_DOCK_HTPASSWD_FILE: /etc/lognara-dock/auth/htpasswd
      # LOGNARA_DOCK_DATA_DIR: /var/lib/lognara-dock
      # LOGNARA_DOCK_SESSION_TTL_SECONDS: "43200"
      # LOGNARA_DOCK_SESSION_IDLE_SECONDS: "3600"
      # LOGNARA_DOCK_BCRYPT_COST: "12"
      # LOGNARA_DOCK_PASSWORD_MIN_LENGTH: "12"
      # LOGNARA_DOCK_LIVE_POLL_MS: "1000"
      # LOGNARA_DOCK_LIVE_LOOKBACK_SECONDS: "300"
      # RUST_LOG: info
    volumes:
      - ./auth:/etc/lognara-dock/auth       # папка, не файл: смена пароля делает rename
      - ./data:/var/lib/lognara-dock        # сессии и passkey (SQLite)
    ports:
      - "127.0.0.1:7403:7403"               # только для nginx на этом хосте
    restart: unless-stopped

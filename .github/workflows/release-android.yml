name: Release Android

on:
  push:
    branches: [dev, master]
    paths:
      - 'lognara-android-client/**'
      - '.github/workflows/release-android.yml'
      - '.github/scripts/release_android.py'
  # Dispatch jobs below accept only refs/heads/dev and refs/heads/master.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build signed Android APK
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint and run unit tests
        working-directory: lognara-android-client
        run: sh ./gradlew lint testDebugUnitTest
      - name: Calculate release version
        id: version
        env:
          CHANNEL: ${{ github.ref == 'refs/heads/master' && 'stable' || 'dev' }}
        run: python3 .github/scripts/release_android.py version --sha "$GITHUB_SHA" --channel "$CHANNEL" --github-output "$GITHUB_OUTPUT"
      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          keystore="$RUNNER_TEMP/lognara-android-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          printf 'ANDROID_SIGNING_STORE_FILE=%s\n' "$keystore" >> "$GITHUB_ENV"
      - name: Assemble signed release APK
        working-directory: lognara-android-client
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LOGNARA_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          LOGNARA_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          LOGNARA_UPDATE_CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          sh ./gradlew assembleRelease \
            "-PlognaraVersionCode=$LOGNARA_VERSION_CODE" \
            "-PlognaraVersionName=$LOGNARA_VERSION_NAME" \
            "-PlognaraUpdateChannel=$LOGNARA_UPDATE_CHANNEL"
      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lognara-android-release.jks"
      - name: Verify APK signature and prepare artifact
        env:
          EXPECTED_ANDROID_CERT_SHA256: AE9E63DB8FD4145DA347D3E1B425B2AD3C81EE0DDDD862056771EC36CD3FB092
        run: |
          set -euo pipefail
          apk="lognara-android-client/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          apksigner="$sdk_root/build-tools/37.0.0/apksigner"
          "$apksigner" verify "$apk"
          actual_fingerprint=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          if [ "$actual_fingerprint" != "$EXPECTED_ANDROID_CERT_SHA256" ]; then
            echo "APK certificate fingerprint mismatch: expected $EXPECTED_ANDROID_CERT_SHA256, got ${actual_fingerprint:-<missing>}" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "$apk" release-assets/lognara-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-release-assets
          path: release-assets/lognara-android.apk
          if-no-files-found: error

  publish:
    name: Publish Android GitHub Release
    needs: [build]
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: android-release-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: android-release-assets
          path: release-assets
      - name: Prepare and publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.ref == 'refs/heads/master' && 'stable' || 'dev' }}
        run: python3 .github/scripts/release_android.py publish release-assets --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --channel "$CHANNEL"

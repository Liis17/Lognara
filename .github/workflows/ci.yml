name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      web: ${{ steps.select.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push' && github.ref != 'refs/heads/master'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/master')
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            ci:
              - '.github/**'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - 'rustfmt.toml'
              - '.rustfmt.toml'
              - 'clippy.toml'
              - '.clippy.toml'
            Lognara-agent:
              - 'Lognara-agent/**'
              - 'Lognara-spool/**'
            Lognara-relay:
              - 'Lognara-relay/**'
              - 'Lognara-spool/**'
            Lognara-spool:
              - 'Lognara-spool/**'
            # Core e2e tests compile agent and relay, which both depend on spool.
            Lognara-core:
              - 'Lognara-core/**'
              - 'Lognara-agent/**'
              - 'Lognara-relay/**'
              - 'Lognara-spool/**'
            Lognara-dock:
              - 'Lognara-dock/**'
              - '!Lognara-dock/web/**'
            web:
              - 'Lognara-dock/web/**'
      - name: Select Rust matrix and web checks
        id: select
        env:
          CHANGED_FILTERS: ${{ steps.filter.outputs.changes }}
        shell: python
        run: |
          import json
          import os

          crates = ["Lognara-agent", "Lognara-relay", "Lognara-spool", "Lognara-core", "Lognara-dock"]
          changed = json.loads(os.environ["CHANGED_FILTERS"] or "[]")
          full = (
              os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
              or os.environ["GITHUB_REF"] == "refs/heads/master"
              or "ci" in changed
          )
          rust = crates if full else [crate for crate in crates if crate in changed]
          web = full or "web" in changed
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"rust={json.dumps(rust)}", file=output)
              print(f"web={str(web).lower()}", file=output)

  rust:
    name: Rust (${{ matrix.crate }})
    needs: [changes]
    if: needs.changes.outputs.rust != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.rust) }}
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }} -> target
          key: ${{ matrix.crate }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build without test features
        run: cargo build --locked
      - name: Unit, integration, e2e and doc tests
        run: cargo test --locked --all-features
      - name: Check memory profile
        if: matrix.crate == 'Lognara-agent' || matrix.crate == 'Lognara-relay'
        run: python3 tests/check-memory-profile.py
      - name: Agent release automation tests
        if: matrix.crate == 'Lognara-agent'
        run: python3 -m unittest discover -s tests -p 'test_release_agent.py'

  web:
    name: Web (TypeScript and build)
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Lognara-dock/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Lognara-dock/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript and build
        run: npm run build
      - name: Query and export unit tests
        run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser interaction tests
        run: npm run test:e2e

  ci:
    name: CI passed
    if: ${{ always() }}
    needs: [changes, rust, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      RUST_REQUIRED: ${{ needs.changes.outputs.rust != '[]' }}
      WEB_REQUIRED: ${{ needs.changes.outputs.web }}
      RUST_RESULT: ${{ needs.rust.result }}
      WEB_RESULT: ${{ needs.web.result }}
    steps:
      - name: Require all checks to pass
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$RUST_REQUIRED" = true ]; then
            test "$RUST_RESULT" = success
          else
            test "$RUST_RESULT" = skipped
          fi
          if [ "$WEB_REQUIRED" = true ]; then
            test "$WEB_RESULT" = success
          else
            test "$WEB_RESULT" = skipped
          fi

  publish-images:
    name: Publish image (${{ matrix.component }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: core
            context: .
            dockerfile: Lognara-core/Dockerfile
          - component: relay
            context: .
            dockerfile: Lognara-relay/Dockerfile
          - component: dock
            context: Lognara-dock
            dockerfile: Lognara-dock/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/lognara-${{ matrix.component }}
          flavor: latest=false
          tags: |
            type=raw,value=master
            type=sha,format=long
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lognara-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=lognara-${{ matrix.component }}

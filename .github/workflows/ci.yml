name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_all:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      web: ${{ steps.select.outputs.web }}
      dotnet: ${{ steps.select.outputs.dotnet }}
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch' && !inputs.release_all
        with:
          base: ${{ github.ref == 'refs/heads/master' && github.ref || github.event.repository.default_branch }}
          predicate-quantifier: some-with-excludes
          filters: |
            ci:
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - 'rustfmt.toml'
              - '.rustfmt.toml'
              - 'clippy.toml'
              - '.clippy.toml'
            Lognara-agent:
              - 'Lognara-agent/**'
              - 'Lognara-spool/**'
            Lognara-relay:
              - 'Lognara-relay/**'
              - 'Lognara-spool/**'
            Lognara-spool:
              - 'Lognara-spool/**'
            # Core e2e tests compile agent and relay, which both depend on spool.
            Lognara-core:
              - 'Lognara-dock/web/public/metrics-nginx.json'
              - 'Lognara-core/**'
              - 'Lognara-agent/**'
              - 'Lognara-relay/**'
              - 'Lognara-spool/**'
            Lognara-dock:
              - 'Lognara-dock/**'
              - '!Lognara-dock/web/**'
            web:
              - 'Lognara-dock/web/**'
            dotnet:
              - 'Lognara-dotnet/**'
              - 'Lognara-agent/src/ingest.rs'
              - 'Lognara-relay/src/normalize.rs'
              - '.github/workflows/ci.yml'
              - '.github/scripts/select_ci.py'
            image-build:
              - '.dockerignore'
              - '.github/workflows/publish-images.yml'
              - '.github/scripts/next-image-version.sh'
      - name: Select Rust matrix, web and .NET checks
        id: select
        env:
          CHANGED_FILTERS: ${{ steps.filter.outputs.changes }}
          FULL_CHECKS: ${{ github.event_name == 'workflow_dispatch' || inputs.release_all }}
        run: python3 .github/scripts/select_ci.py

  automation:
    name: Workflow automation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/tests -p 'test_*.py'

  rust:
    name: Rust (${{ matrix.crate }})
    needs: [changes]
    if: needs.changes.outputs.rust != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.rust) }}
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }} -> target
          key: ${{ matrix.crate }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build without test features
        run: cargo build --locked
      - name: Unit, integration, e2e and doc tests
        run: cargo test --locked --all-features
      - name: Check memory profile
        if: matrix.crate == 'Lognara-agent' || matrix.crate == 'Lognara-relay'
        run: python3 tests/check-memory-profile.py
      - name: Agent release automation tests
        if: matrix.crate == 'Lognara-agent'
        run: python3 -m unittest discover -s tests -p 'test_release_agent.py'

  web:
    name: Web (TypeScript and build)
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Lognara-dock/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Lognara-dock/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript and build
        run: npm run build
      - name: Experimental tsc-rs type check (non-blocking)
        continue-on-error: true
        run: npm run typecheck:rs
      - name: Query and export unit tests
        run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser interaction tests
        run: npm run test:e2e

  dotnet:
    name: .NET Serilog (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Lognara-dotnet
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: Lognara-dotnet/**/packages.lock.json
      - name: Restore locked dependencies
        run: dotnet restore tests/Serilog.Sinks.Lognara.Tests --locked-mode
      - name: Build and test
        run: dotnet test tests/Serilog.Sinks.Lognara.Tests -c Release --no-restore
      - name: Build NuGet package
        run: dotnet pack src/Serilog.Sinks.Lognara -c Release --no-build --no-restore -o artifacts
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: serilog-nuget
          path: Lognara-dotnet/artifacts/*.nupkg
          if-no-files-found: error

  ci:
    name: CI passed
    if: ${{ always() }}
    needs: [changes, automation, rust, web, dotnet]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      AUTOMATION_RESULT: ${{ needs.automation.result }}
      RUST_REQUIRED: ${{ needs.changes.outputs.rust != '[]' }}
      WEB_REQUIRED: ${{ needs.changes.outputs.web }}
      RUST_RESULT: ${{ needs.rust.result }}
      WEB_RESULT: ${{ needs.web.result }}
      DOTNET_REQUIRED: ${{ needs.changes.outputs.dotnet }}
      DOTNET_RESULT: ${{ needs.dotnet.result }}
    steps:
      - name: Require all checks to pass
        run: |
          test "$CHANGES_RESULT" = success
          test "$AUTOMATION_RESULT" = success
          if [ "$RUST_REQUIRED" = true ]; then
            test "$RUST_RESULT" = success
          else
            test "$RUST_RESULT" = skipped
          fi
          if [ "$WEB_REQUIRED" = true ]; then
            test "$WEB_RESULT" = success
          else
            test "$WEB_RESULT" = skipped
          fi
          if [ "$DOTNET_REQUIRED" = true ]; then
            test "$DOTNET_RESULT" = success
          else
            test "$DOTNET_RESULT" = skipped
          fi

  publish-nuget:
    name: Publish Serilog to NuGet.org
    # Override implicit success(): optional Rust/web jobs may be skipped upstream.
    if: ${{ !cancelled() && needs.ci.result == 'success' && needs.changes.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.dotnet == 'true' }}
    needs: [ci, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nuget
    concurrency:
      group: publish-serilog-nuget
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check publisher configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo '::error::Set the NUGET_USER Actions variable and configure NuGet.org Trusted Publishing. See Lognara-dotnet/README.md.'
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: serilog-nuget
          path: artifacts
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: NuGet login with OIDC
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish tested package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'artifacts/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-images:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.release_all) && needs.changes.outputs.images != '[]'
    needs: [ci, changes]
    uses: ./.github/workflows/publish-images.yml
    with:
      components: ${{ needs.changes.outputs.images }}
    secrets: inherit

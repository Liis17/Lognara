name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_all:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      web: ${{ steps.select.outputs.web }}
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch' && !inputs.release_all
        with:
          base: ${{ github.ref == 'refs/heads/master' && github.ref || github.event.repository.default_branch }}
          predicate-quantifier: some-with-excludes
          filters: |
            ci:
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - 'rustfmt.toml'
              - '.rustfmt.toml'
              - 'clippy.toml'
              - '.clippy.toml'
            Lognara-agent:
              - 'Lognara-agent/**'
              - 'Lognara-spool/**'
            Lognara-relay:
              - 'Lognara-relay/**'
              - 'Lognara-spool/**'
            Lognara-spool:
              - 'Lognara-spool/**'
            # Core e2e tests compile agent and relay, which both depend on spool.
            Lognara-core:
              - 'Lognara-core/**'
              - 'Lognara-agent/**'
              - 'Lognara-relay/**'
              - 'Lognara-spool/**'
            Lognara-dock:
              - 'Lognara-dock/**'
              - '!Lognara-dock/web/**'
            web:
              - 'Lognara-dock/web/**'
            image-build:
              - '.dockerignore'
              - '.github/workflows/publish-images.yml'
              - '.github/scripts/next_image_version.py'
      - name: Select Rust matrix and web checks
        id: select
        env:
          CHANGED_FILTERS: ${{ steps.filter.outputs.changes }}
          FULL_CHECKS: ${{ github.event_name == 'workflow_dispatch' || inputs.release_all }}
        run: python3 .github/scripts/select_ci.py

  automation:
    name: Workflow automation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/tests -p 'test_*.py'

  rust:
    name: Rust (${{ matrix.crate }})
    needs: [changes]
    if: needs.changes.outputs.rust != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.rust) }}
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }} -> target
          key: ${{ matrix.crate }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build without test features
        run: cargo build --locked
      - name: Unit, integration, e2e and doc tests
        run: cargo test --locked --all-features
      - name: Check memory profile
        if: matrix.crate == 'Lognara-agent' || matrix.crate == 'Lognara-relay'
        run: python3 tests/check-memory-profile.py
      - name: Agent release automation tests
        if: matrix.crate == 'Lognara-agent'
        run: python3 -m unittest discover -s tests -p 'test_release_agent.py'

  web:
    name: Web (TypeScript and build)
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Lognara-dock/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Lognara-dock/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript and build
        run: npm run build
      - name: Query and export unit tests
        run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser interaction tests
        run: npm run test:e2e

  ci:
    name: CI passed
    if: ${{ always() }}
    needs: [changes, automation, rust, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      AUTOMATION_RESULT: ${{ needs.automation.result }}
      RUST_REQUIRED: ${{ needs.changes.outputs.rust != '[]' }}
      WEB_REQUIRED: ${{ needs.changes.outputs.web }}
      RUST_RESULT: ${{ needs.rust.result }}
      WEB_RESULT: ${{ needs.web.result }}
    steps:
      - name: Require all checks to pass
        run: |
          test "$CHANGES_RESULT" = success
          test "$AUTOMATION_RESULT" = success
          if [ "$RUST_REQUIRED" = true ]; then
            test "$RUST_RESULT" = success
          else
            test "$RUST_RESULT" = skipped
          fi
          if [ "$WEB_REQUIRED" = true ]; then
            test "$WEB_RESULT" = success
          else
            test "$WEB_RESULT" = skipped
          fi

  publish-images:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.release_all) && needs.changes.outputs.images != '[]'
    needs: [ci, changes]
    uses: ./.github/workflows/publish-images.yml
    with:
      components: ${{ needs.changes.outputs.images }}
    secrets: inherit

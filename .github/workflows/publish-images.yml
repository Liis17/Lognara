name: Publish container images

on:
  workflow_call:
    inputs:
      components:
        required: true
        type: string
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Release image (${{ matrix.component }})
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.components) }}
    concurrency:
      group: container-release-${{ matrix.component }}
      cancel-in-progress: false
      queue: max
    env:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Log in to private registry
        uses: docker/login-action@v4
        with:
          registry: docker.barkfluff.com
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Promote tested dev image without rebuilding
        if: github.ref == 'refs/heads/master'
        env:
          COMPONENT: ${{ matrix.component }}
        run: python3 .github/scripts/promote_images.py
      - name: Dev build version
        if: github.ref == 'refs/heads/dev'
        id: version
        env:
          COMPONENT: ${{ matrix.component }}
        run: echo "version=dev-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Image tags and labels
        if: github.ref == 'refs/heads/dev'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.barkfluff.com/lognara-${{ matrix.component }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=dev
            type=sha,format=long
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Build and publish
        if: github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component == 'dock' && 'Lognara-dock' || '.' }}
          file: Lognara-${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            LOGNARA_RELEASE_VERSION=${{ steps.version.outputs.version }}
            LOGNARA_GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lognara-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=lognara-${{ matrix.component }}
      - name: Record published image
        if: github.ref == 'refs/heads/dev'
        env:
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "Published docker.barkfluff.com/lognara-$COMPONENT:$VERSION" >> "$GITHUB_STEP_SUMMARY"

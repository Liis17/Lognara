[package]
name = "lognara-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Принимает логи приложения по localhost, копит их в памяти и сжатыми пачками отправляет в lognara-relay"
publish = false

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
zstd = "0.13"

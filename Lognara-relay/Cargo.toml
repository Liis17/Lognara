[package]
name = "lognara-relay"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Принимает пачки логов от lognara-agent, группирует события по источнику и сжатыми пачками отправляет в lognara-core"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
bytes = "1"
http-body = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
subtle = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v7", "serde"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

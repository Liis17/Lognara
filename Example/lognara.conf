server {
    listen 80;
    server_name dock.barkfluff.com;

    return 301 https://dock.barkfluff.com$request_uri;
}

server {
    listen 80;
    server_name inputlogs.barkfluff.com;

    return 308 https://inputlogs.barkfluff.com$request_uri;
}

server {
    listen 443 ssl;
    server_name dock.barkfluff.com;

    ssl_certificate     /etc/nginx/certs/barkfluff.com-crt.pem;
    ssl_certificate_key /etc/nginx/certs/barkfluff.com-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://lognara-dock:7403;
    }

    # Live-логи: SSE без буферизации.
    location = /api/logs/stream {
        proxy_pass http://lognara-dock:7403;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 443 ssl;
    server_name inputlogs.barkfluff.com;

    ssl_certificate     /etc/nginx/certs/barkfluff.com-crt.pem;
    ssl_certificate_key /etc/nginx/certs/barkfluff.com-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Соответствует стандартному лимиту сжатой пачки core: 64 MiB.
    client_max_body_size 64m;
    client_body_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Все маршруты, необходимые relay.
    location ~ ^/v1/(batches|agents|heartbeat)$ {
        proxy_pass http://lognara-dock:7402;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }

    # Query/admin API через публичный ingest-домен не публикуются.
    location / {
        return 404;
    }
}

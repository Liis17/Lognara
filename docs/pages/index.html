  <style>

    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

    </div>
  </noscript>

<body>
  <div id="__bundler_placeholder">Loading Lognara — логи под вашим контролем...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

8;letter-spacing:-.04em;font-weight:500;margin-top:22px;max-width:11ch}\n.hero .lead{margin-top:28px}\n\n/* pipeline */\n.pipe{display:flex;align-items:stretch;margin-top:72px}\n.node{flex:1 1 0;min-width:0;background:#FDF7EF;border:1px solid rgba(28,22,22,.14);border-radius:16px;padding:18px 18px 16px}\n.node.core{border-color:#1C1616}\n.node b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}\n.node .port{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:12px;color:#5E5552;margin-top:4px}\n.node .st{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:12px;margin-top:22px;padding-top:12px;border-top:1px dashed rgba(28,22,22,.14);color:#5E5552}\n.link{flex:0 0 56px;position:relative;align-self:center;height:1px;background:rgba(28,22,22,.14)}\n.pkt{position:absolute;top:-3px;left:0;width:7px;height:7px;border-radius:50%;background:#752323;opacity:0;animation:travel 2.8s linear infinite}\n.pkt.d2{animation-delay:1.4s}\n.cap{font-size:14px;color:#5E5552;margin-top:20px;max-width:70ch}\n@keyframes travel{0%{left:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:calc(100% - 7px);opacity:0}}\n@keyframes travelY{0%{top:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:calc(100% - 7px);opacity:0}}\n@media (max-width:719px){\n  .pipe{flex-direction:column}\n  .node{flex:none;width:100%}\n  .link{flex:0 0 32px;width:1px;height:32px;margin:0 auto;align-self:auto}\n  .pkt{left:-3px;top:0;animation-name:travelY}\n}\n@media (prefers-reduced-motion:reduce){.pkt{display:none}}\n\n/* facts */\n.facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(28,22,22,.14)}\n@media (min-width:900px){.facts{grid-template-columns:repeat(4,1fr)}}\n.fact{padding:22px 16px 22px 0;font-size:15px}\n.fact span{display:block;font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:12px;color:#5E5552;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}\n\n/* features */\n.grid3{display:grid;grid-template-columns:1fr;margin-top:56px;border-top:1px solid rgba(28,22,22,.14)}\n@media (min-width:720px){.grid3{grid-template-columns:1fr 1fr}}\n@media (min-width:960px){.grid3{grid-template-columns:repeat(3,1fr)}}\n.cell{padding:32px 24px 36px 0;border-bottom:1px solid rgba(28,22,22,.14)}\n.cell .idx{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:12px;color:#752323}\n.cell h3{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:14px 0 10px}\n.cell p{color:#5E5552;font-size:15px}\n\n/* architecture */\n.grid2{display:grid;grid-template-columns:1fr;gap:16px;margin-top:56px}\n@media (min-width:720px){.grid2{grid-template-columns:1fr 1fr}}\n.card{background:#FDF7EF;border:1px solid rgba(28,22,22,.14);border-radius:16px;padding:28px}\n.card .port{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:13px;color:#752323}\n.card h3{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:8px 0 10px}\n.card p{color:#5E5552;font-size:15px}\n.acks{margin-top:56px;border-top:1px solid rgba(28,22,22,.14)}\n.ack{display:grid;grid-template-columns:72px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid rgba(28,22,22,.14);align-items:baseline}\n.ack .code{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:20px;font-weight:500}\n.ack p{color:#5E5552;font-size:15px;max-width:64ch}\n.ack p strong{color:#1C1616;font-weight:500}\n\n/* code */\n.split{display:grid;gap:32px;margin-top:56px}\n@media (min-width:900px){.split{grid-template-columns:1fr 1fr;gap:40px}}\n.split>*{min-width:0}\n.label{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#5E5552;margin-bottom:12px}\npre.code{margin:0;background:#1C1616;color:#F9EFE4;border-radius:14px;padding:20px 22px;font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:13px;line-height:1.7;overflow-x:auto;max-width:100%;white-space:pre}\npre.code .c{color:#A8988F}\npre.code .s{color:#F3C28B}\npre.code .k{color:#F4B6A8}\n.kv{display:grid;grid-template-columns:112px 1fr;gap:10px 16px;margin:0;background:#FDF7EF;border:1px solid rgba(28,22,22,.14);border-radius:14px;padding:22px}\n.kv dt{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:13px;color:#5E5552}\n.kv dd{margin:0;font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:13px;word-break:break-all}\n.pill{display:inline-block;font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--blush,#FCDED4);color:#752323}\n\n/* api */\n.eps{border-top:1px solid rgba(28,22,22,.14)}\n.ep{padding:18px 0;border-bottom:1px solid rgba(28,22,22,.14)}\n.ep .path{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:14px;word-break:break-all}\n.ep .m{color:#752323;font-weight:500;margin-right:6px}\n.ep p{color:#5E5552;font-size:15px;margin-top:6px}\n\n/* benchmarks (inverse) */\n.inv{background:#1C1616;color:#F9EFE4;border-top:none}\n.inv .eyebrow,.inv .lead,.inv .note,.inv .stat .t{color:#CDBFB6}\n.inv .note a{color:#F3C28B}\n.inv a:hover{color:#F3C28B}\n.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:56px;border-top:1px solid rgba(249,239,228,.18)}\n@media (min-width:900px){.stats{grid-template-columns:repeat(4,1fr)}}\n.stat{padding:28px 16px 28px 0;border-bottom:1px solid rgba(249,239,228,.18)}\n.stat .n{font-size:clamp(38px,5vw,60px);font-weight:500;letter-spacing:-.035em;line-height:1}\n.stat .t{margin-top:14px;font-size:14px;max-width:24ch}\n\n/* quick start */\n.steps{display:grid;gap:44px;margin-top:56px}\n.step .head{display:flex;gap:16px;align-items:baseline;margin-bottom:16px}\n.step .num{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:13px;color:#752323}\n.step h3{font-size:20px;font-weight:600;letter-spacing:-.01em}\n.step .sub{color:#5E5552;font-size:15px;margin-top:-8px;margin-bottom:16px}\n\n/* faq */\n.faq{margin-top:56px;border-top:1px solid rgba(28,22,22,.14)}\n.faq details{border-bottom:1px solid rgba(28,22,22,.14)}\n.faq summary{list-style:none;cursor:pointer;padding:22px 0;font-size:18px;font-weight:500;display:flex;justify-content:space-between;align-items:flex-start;gap:24px}\n.faq summary::-webkit-details-marker{display:none}\n.faq summary::after{content:\"+\";font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:20px;line-height:1.2;color:#752323;flex:none}\n.faq details[open] summary::after{content:\"\\2212\"}\n.faq .ans{padding:0 48px 24px 0;color:#5E5552;font-size:16px;max-width:70ch}\n\n/* footer */\n.foot{border-top:1px solid rgba(28,22,22,.14);padding:88px 0 40px}\n.close{font-size:clamp(40px,6vw,76px);line-height:1;letter-spacing:-.035em;font-weight:500;max-width:14ch}\n.links{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:40px;font-size:15px}\n.links a{text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(28,22,22,.14)}\n.links a:hover{text-decoration-color:currentColor}\n.legal{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:72px;padding-top:24px;border-top:1px solid rgba(28,22,22,.14);font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:12px;color:#5E5552}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"page\" data-canvas-width=\"1280\" data-canvas-height=\"6400\">\n\n<div class=\"wrap\">\n  <header class=\"top\">\n    <a class=\"brand\" href=\"#top\" aria-label=\"Lognara, в начало страницы\">\n      <img src=\"34010ed7-b452-4189-a383-e661da24e9d9\" alt=\"\" width=\"28\" height=\"28\">\n      Lognara\n    <\u002Fa>\n    <nav class=\"nav\" aria-label=\"Основная\">\n      <a href=\"#features\">Возможности<\u002Fa>\n      <a href=\"#architecture\">Архитектура<\u002Fa>\n      <a href=\"#search\">API<\u002Fa>\n      <a href=\"#benchmarks\">Бенчмарк<\u002Fa>\n      <a href=\"#start\">Быстрый старт<\u002Fa>\n      <a href=\"#faq\">FAQ<\u002Fa>\n    <\u002Fnav>\n    <a class=\"btn ghost\" href=\"https://github.com/Liis17/Lognara\">GitHub ↗<\u002Fa>\n  <\u002Fheader>\n<\u002Fdiv>\n\n<main>\n<section class=\"hero\" id=\"top\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Open source · Rust · Self-hosted logging<\u002Fp>\n    <h1>Логи под <span style=\"color: {{accent}}\">вашим<\u002Fspan> контролем.<\u002Fh1>\n    <p class=\"lead\">Lognara собирает события приложений, доставляет их через дисковые очереди, которые переживают перезапуски, и позволяет искать по тексту, уровню и trace ID. Всё работает на вашей инфраструктуре.<\u002Fp>\n    <div class=\"ctas\">\n      <a class=\"btn\" href=\"https://github.com/Liis17/Lognara\">Смотреть на GitHub ↗<\u002Fa>\n      <a class=\"btn ghost\" href=\"#architecture\">Как это работает<\u002Fa>\n    <\u002Fdiv>\n\n    <div class=\"pipe\" role=\"img\" aria-label=\"Путь события: приложение, Agent, Relay, Core\">\n      <div class=\"node\">\n        <b>Приложение<\u002Fb>\n        <div class=\"port\">ваш сервис<\u002Fdiv>\n        <div class=\"st\">text · json · binary<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"link\"><span class=\"pkt\"><\u002Fspan><span class=\"pkt d2\"><\u002Fspan><\u002Fdiv>\n      <div class=\"node\">\n        <b>Agent<\u002Fb>\n        <div class=\"port\">localhost · :7400<\u002Fdiv>\n        <div class=\"st\">202 · на диске<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"link\"><span class=\"pkt\"><\u002Fspan><span class=\"pkt d2\"><\u002Fspan><\u002Fdiv>\n      <div class=\"node\">\n        <b>Relay<\u002Fb>\n        <div class=\"port\">на хосте · :7401<\u002Fdiv>\n        <div class=\"st\">202 · на диске<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"link\"><span class=\"pkt\"><\u002Fspan><span class=\"pkt d2\"><\u002Fspan><\u002Fdiv>\n      <div class=\"node core\">\n        <b>Core<\u002Fb>\n        <div class=\"port\">центр · :7402<\u002Fdiv>\n        <div class=\"st\"><span style=\"color: {{accent}}\">204 · fsync WAL<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"cap\">Agent и Relay отвечают 202, когда запись сохранена на диске этого этапа. Core отвечает 204 после fsync журнала WAL.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"wrap\">\n  <div class=\"facts\">\n    <div class=\"fact\"><span>Язык<\u002Fspan>Rust 1.94+<\u002Fdiv>\n    <div class=\"fact\"><span>Лицензия<\u002Fspan>MIT<\u002Fdiv>\n    <div class=\"fact\"><span>Внешняя БД<\u002Fspan>Не требуется<\u002Fdiv>\n    <div class=\"fact\"><span>Хранение<\u002Fspan>7 дней по умолчанию<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<section class=\"sec\" id=\"features\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Возможности<\u002Fp>\n    <h2>Доставка, которой можно доверять, и поиск, который не требует отдельной базы.<\u002Fh2>\n    <div class=\"grid3\">\n      <div class=\"cell\">\n        <div class=\"idx\">01 — Доставка<\u002Fdiv>\n        <h3>Надёжная доставка<\u002Fh3>\n        <p>Agent и Relay отвечают 202 только после записи на диск. Очереди переживают обрывы связи и перезапуски и повторяют пачки, пока Core не подтвердит приём.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cell\">\n        <div class=\"idx\">02 — Поиск<\u002Fdiv>\n        <h3>Полнотекстовый поиск<\u002Fh3>\n        <p>Tantivy индексирует текст сообщения. Фильтры по окружению, серверу, сервису, уровню и trace ID, пагинация курсором.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cell\">\n        <div class=\"idx\">03 — Хранение<\u002Fdiv>\n        <h3>Хранение для логов<\u002Fh3>\n        <p>WAL с CRC32 и SHA-256 до подтверждения. Закрытые сегменты в Parquet с ZSTD. Retention по времени поступления, 7 дней по умолчанию.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cell\">\n        <div class=\"idx\">04 — Аналитика<\u002Fdiv>\n        <h3>Гистограммы и группировки<\u002Fh3>\n        <p>Число событий по временным корзинам и group-by по одному или двум измерениям. Вычисляет DataFusion.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cell\">\n        <div class=\"idx\">05 — Trace<\u002Fdiv>\n        <h3>Логи по trace ID<\u002Fh3>\n        <p>Все события одного trace в порядке времени. Это связанные логи, а не APM-waterfall: спаны не строятся.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cell\">\n        <div class=\"idx\">06 — Лимиты<\u002Fdiv>\n        <h3>Защита от перегрузки<\u002Fh3>\n        <p>Размеры и бюджеты памяти проверяются до разбора тела. При переполнении новые запросы получают 503, а уже принятые данные не вытесняются.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"architecture\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Архитектура<\u002Fp>\n    <h2>Четыре части, один путь события.<\u002Fh2>\n    <p class=\"lead\">Agent стоит рядом с приложением, Relay работает на каждом хосте, Core — центральный сервер. Spool — общая библиотека дисковой очереди для Agent и Relay.<\u002Fp>\n    <div class=\"grid2\">\n      <div class=\"card\">\n        <div class=\"port\">localhost · :7400<\u002Fdiv>\n        <h3>Agent<\u002Fh3>\n        <p>HTTP-приём текста, JSON и бинарных данных. Добавляет service, server и backend, пакует записи в MessagePack и zstd и отправляет их в Relay.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"port\">на хосте · :7401<\u002Fdiv>\n        <h3>Relay<\u002Fh3>\n        <p>Проверяет токен, распознаёт уровень, сообщение, action и trace ID. Группирует события по источнику и держит FIFO-очередь до подтверждения Core.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"port\">центр · :7402<\u002Fdiv>\n        <h3>Core<\u002Fh3>\n        <p>WAL с fsync, сегменты Parquet с ZSTD, индекс Tantivy, каталог SQLite. Поиск, trace lookup, статистика и метрики Prometheus.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"port\">библиотека · без порта<\u002Fdiv>\n        <h3>Spool<\u002Fh3>\n        <p>Атомарные группы файлов: запись во временный каталог, fsync, rename. Порядок FIFO сохраняется, повреждённые данные не пропускаются молча.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"acks\">\n      <div class=\"ack\">\n        <div class=\"code\">202<\u002Fdiv>\n        <p><strong>Agent или Relay записали данные на диск.<\u002Fstrong> Это подтверждение этапа, а не появление записи в поиске.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ack\">\n        <div class=\"code\">204<\u002Fdiv>\n        <p><strong>Core синхронизировал WAL (fsync).<\u002Fstrong> Запись надёжно сохранена на центральном сервере.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ack\">\n        <div class=\"code\">1 с<\u002Fdiv>\n        <p><strong>Видимость в поиске.<\u002Fstrong> Запись появляется после публикации снимка Core. Стандартный интервал обновления — 1000 мс.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"events\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Структура события<\u002Fp>\n    <h2>Ваш JSON становится структурированным событием.<\u002Fh2>\n    <p class=\"lead\">Agent не меняет смысл записи. Relay извлекает известные поля, а остальные сохраняет целиком в attributes.<\u002Fp>\n    <div class=\"split\">\n      <div>\n        <div class=\"label\">Вход · JSON от приложения<\u002Fdiv>\n        <pre class=\"code\"><span class=\"c\">POST /v1/logs<\u002Fspan>\n{\n  \"level\": <span class=\"s\">\"error\"<\u002Fspan>,\n  \"message\": <span class=\"s\">\"Failed to save file metadata\"<\u002Fspan>,\n  \"action\": <span class=\"s\">\"file.upload\"<\u002Fspan>,\n  \"trace_id\": <span class=\"s\">\"8c21f0a4b6c8d0e12a4b6c8d0e1f3a5b\"<\u002Fspan>,\n  \"filename\": <span class=\"s\">\"cat.png\"<\u002Fspan>,\n  \"user_id\": <span class=\"k\">18271<\u002Fspan>\n}<\u002Fpre>\n      <\u002Fdiv>\n      <div>\n        <div class=\"label\">Событие в Core · пример<\u002Fdiv>\n        <dl class=\"kv\">\n          <dt>timestamp<\u002Fdt><dd>2026-09-29T10:41:51.871Z<\u002Fdd>\n          <dt>environment<\u002Fdt><dd>production<\u002Fdd>\n          <dt>server<\u002Fdt><dd>eu-prod-01<\u002Fdd>\n          <dt>backend<\u002Fdt><dd>demo<\u002Fdd>\n          <dt>service<\u002Fdt><dd>files<\u002Fdd>\n          <dt>level<\u002Fdt><dd><span class=\"pill\">error<\u002Fspan><\u002Fdd>\n          <dt>action<\u002Fdt><dd>file.upload<\u002Fdd>\n          <dt>trace_id<\u002Fdt><dd>8c21f0a4b6c8d0e12a4b6c8d0e1f3a5b<\u002Fdd>\n          <dt>message<\u002Fdt><dd>Failed to save file metadata<\u002Fdd>\n          <dt>attributes<\u002Fdt><dd>filename, user_id<\u002Fdd>\n        <\u002Fdl>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"note\">Иллюстративный пример, не результат живого запроса. Поля server, backend и service задаёт Agent из своей конфигурации.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"search\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Поиск и статистика<\u002Fp>\n    <h2>Работающий HTTP API для поиска и аналитики.<\u002Fh2>\n    <p class=\"lead\">Веб-консоли в репозитории пока нет. Уже работают эндпоинты, которые можно использовать в своих инструментах.<\u002Fp>\n    <div class=\"split\">\n      <div class=\"eps\">\n        <div class=\"ep\">\n          <div class=\"path\"><span class=\"m\">POST<\u002Fspan>/v1/logs/search<\u002Fdiv>\n          <p>Фильтры по полям, полнотекстовый поиск по message, курсорная пагинация.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ep\">\n          <div class=\"path\"><span class=\"m\">GET<\u002Fspan>/v1/traces/{trace_id}<\u002Fdiv>\n          <p>Все события одного trace в порядке времени.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ep\">\n          <div class=\"path\"><span class=\"m\">POST<\u002Fspan>/v1/stats/histogram<\u002Fdiv>\n          <p>Число событий по временным корзинам, от 1 секунды до суток.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ep\">\n          <div class=\"path\"><span class=\"m\">POST<\u002Fspan>/v1/stats/group-by<\u002Fdiv>\n          <p>Группировка по одному или двум полям: сервис, сервер, уровень и другие.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ep\">\n          <div class=\"path\"><span class=\"m\">GET<\u002Fspan>/metrics<\u002Fdiv>\n          <p>Метрики Core в формате Prometheus. Доступ по токену.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"label\">Пример · POST /v1/logs/search<\u002Fdiv>\n        <pre class=\"code\"><span class=\"c\">Authorization: Bearer &lt;QUERY_TOKEN&gt;<\u002Fspan>\n{\n  \"from\": <span class=\"s\">\"2026-09-29T10:00:00Z\"<\u002Fspan>,\n  \"to\": <span class=\"s\">\"2026-09-29T11:00:00Z\"<\u002Fspan>,\n  \"filters\": {\n    \"service\": [<span class=\"s\">\"files\"<\u002Fspan>, <span class=\"s\">\"api\"<\u002Fspan>],\n    \"level\": [<span class=\"s\">\"error\"<\u002Fspan>, <span class=\"s\">\"warn\"<\u002Fspan>]\n  },\n  \"text\": { \"query\": <span class=\"s\">\"connection refused\"<\u002Fspan>, \"mode\": <span class=\"s\">\"phrase\"<\u002Fspan> },\n  \"limit\": <span class=\"k\">100<\u002Fspan>\n}<\u002Fpre>\n        <p class=\"note\">Полнотекстово индексируется message. Поля attributes в фильтрах пока не участвуют.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec inv\" id=\"benchmarks\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Бенчмарк · 30 сентября 2026<\u002Fp>\n    <h2>Цифры из реального прогона.<\u002Fh2>\n    <p class=\"lead\">30-минутная синтетическая нагрузка. Генератор и Core работали на одной машине.<\u002Fp>\n    <div class=\"stats\">\n      <div class=\"stat\"><div class=\"n\">18,0 млн<\u002Fdiv><div class=\"t\">событий принято и найдено после перезапуска, без ошибок в сценарии<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"n\">10 000<\u002Fdiv><div class=\"t\">событий в секунду, среднее за 30 минут<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"n\">21 мс<\u002Fdiv><div class=\"t\">p99 подтверждения ACK от Core<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"n\">1,28 с<\u002Fdiv><div class=\"t\">p99 от ACK до появления в поиске<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"note\">macOS arm64 · 10 логических CPU · 16 GiB RAM · локальный SSD · release core v1. Пиковая память Core составила 426 MiB, поиск p99 — 39 мс. Это не гарантия для другого железа: целевой сценарий 4 CPU / 8 GiB пока не проверен на Linux-сервере. <a href=\"https://github.com/Liis17/Lognara/blob/master/Lognara-core/docs/benchmark-results.md\">Полный отчёт ↗<\u002Fa><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"start\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Быстрый старт<\u002Fp>\n    <h2>Запуск из исходников за три шага.<\u002Fh2>\n    <p class=\"lead\">Готовых Docker-образов в текущей версии нет. Нужен Rust 1.94+.<\u002Fp>\n    <div class=\"steps\">\n      <div class=\"step\">\n        <div class=\"head\"><span class=\"num\">01<\u002Fspan><h3>Соберите бинарники<\u002Fh3><\u002Fdiv>\n        <pre class=\"code\"><span class=\"c\"># из корня репозитория<\u002Fspan>\ncargo build --release --manifest-path Lognara-core/Cargo.toml --bin lognara-core\ncargo build --release --manifest-path Lognara-relay/Cargo.toml\ncargo build --release --manifest-path Lognara-agent/Cargo.toml<\u002Fpre>\n      <\u002Fdiv>\n      <div class=\"step\">\n        <div class=\"head\"><span class=\"num\">02<\u002Fspan><h3>Запустите Core, Relay и Agent<\u002Fh3><\u002Fdiv>\n        <pre class=\"code\"><span class=\"c\"># Core<\u002Fspan>\nLOGNARA_INGEST_TOKEN=ingest-secret LOGNARA_QUERY_TOKEN=query-secret \\\nLOGNARA_DATA_DIR=/tmp/lognara-demo/core Lognara-core/target/release/lognara-core\n\n<span class=\"c\"># Relay<\u002Fspan>\nLOGNARA_CORE_URL=http://127.0.0.1:7402/v1/batches LOGNARA_CORE_TOKEN=ingest-secret \\\nLOGNARA_RELAY_TOKEN=relay-secret LOGNARA_SPOOL_DIR=/tmp/lognara-demo/relay-spool \\\nLOGNARA_FLUSH_INTERVAL_MS=1000 Lognara-relay/target/release/lognara-relay\n\n<span class=\"c\"># Agent<\u002Fspan>\nLOGNARA_SERVICE=api LOGNARA_SERVER=local LOGNARA_BACKEND=demo LOGNARA_RELAY_TOKEN=relay-secret \\\nLOGNARA_RELAY_URL=http://127.0.0.1:7401/v1/batches LOGNARA_SPOOL_DIR=/tmp/lognara-demo/agent-spool \\\nLOGNARA_FLUSH_INTERVAL_MS=1000 Lognara-agent/target/release/lognara-agent<\u002Fpre>\n      <\u002Fdiv>\n      <div class=\"step\">\n        <div class=\"head\"><span class=\"num\">03<\u002Fspan><h3>Отправьте лог и найдите его<\u002Fh3><\u002Fdiv>\n        <pre class=\"code\"><span class=\"c\"># отправить в Agent<\u002Fspan>\ncurl -X POST http://127.0.0.1:7400/v1/logs \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"level\":\"error\",\"message\":\"connection refused\",\"action\":\"db.connect\"}'\n\n<span class=\"c\"># найти в Core<\u002Fspan>\ncurl -X POST http://127.0.0.1:7402/v1/logs/search \\\n  -H 'Authorization: Bearer query-secret' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"from\":\"2020-01-01T00:00:00Z\",\"to\":\"2100-01-01T00:00:00Z\",\"filters\":{\"level\":[\"error\"]},\"text\":{\"query\":\"connection refused\",\"mode\":\"phrase\"}}'<\u002Fpre>\n        <p class=\"note\">Токены в примере демонстрационные. Для внешнего HTTP поставьте TLS-прокси, например nginx.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"faq\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">FAQ<\u002Fp>\n    <h2>Вопросы, которые задают чаще всего.<\u002Fh2>\n    <div class=\"faq\">\n      <details>\n        <summary>Lognara — это облачный сервис?<\u002Fsummary>\n        <p class=\"ans\">Нет. Это набор сервисов, которые вы запускаете сами. Личного кабинета, SaaS и управляемого хостинга в проекте нет.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Гарантирует ли Lognara отсутствие потерь?<\u002Fsummary>\n        <p class=\"ans\">Нет. Гарантия относится к запросам, подтверждённым на исправном диске. Доставка работает по схеме at-least-once: повторы возможны. Неподтверждённый запрос приложение должно повторить само.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Что будет, если Core недоступен?<\u002Fsummary>\n        <p class=\"ans\">Relay сохраняет подтверждённые пачки на диске и повторит доставку после восстановления связи. Если очередь заполнится, новые запросы получат 503, и клиент должен отправить их снова.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Есть ли веб-интерфейс?<\u002Fsummary>\n        <p class=\"ans\">Пока нет. В репозитории есть HTTP API для поиска, трассировок и статистики. Браузерная консоль потребует отдельного защищённого бэкенда и будет отдельной задачей.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Нужна ли внешняя база данных?<\u002Fsummary>\n        <p class=\"ans\">Нет. Используются локальные Parquet-сегменты, индекс Tantivy и SQLite-каталог. Нужен надёжный локальный диск.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Можно ли искать по полям attributes?<\u002Fsummary>\n        <p class=\"ans\">Нет. Attributes сохраняются и возвращаются в событиях, но в текущей версии не индексируются.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Есть ли готовый Docker-образ?<\u002Fsummary>\n        <p class=\"ans\">В версии 0.1.0 Dockerfile и опубликованных образов нет. Сервисы собираются из исходников на Rust.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Какая лицензия?<\u002Fsummary>\n        <p class=\"ans\">MIT. Исходники открыты, их можно изучить, менять и использовать.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n\n<footer class=\"foot\">\n  <div class=\"wrap\">\n    <img src=\"34010ed7-b452-4189-a383-e661da24e9d9\" alt=\"\" width=\"56\" height=\"56\" style=\"border-radius:14px\">\n    <p class=\"close\" style=\"margin-top:32px\">Логи под вашим контролем.<\u002Fp>\n    <div class=\"ctas\">\n      <a class=\"btn\" href=\"https://github.com/Liis17/Lognara\">Открыть на GitHub ↗<\u002Fa>\n      <a class=\"btn ghost\" href=\"https://github.com/Liis17/Lognara#readme\">README ↗<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"links\">\n      <a href=\"https://github.com/Liis17/Lognara/blob/master/Lognara-core/README.md\">Документация Core ↗<\u002Fa>\n      <a href=\"https://github.com/Liis17/Lognara/blob/master/Lognara-core/docs/benchmark-results.md\">Отчёт о бенчмарке ↗<\u002Fa>\n      <a href=\"https://github.com/Liis17/Lognara/blob/master/LICENSE\">Лицензия MIT ↗<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"legal\">\n      <span>Lognara v0.1.0 · Rust · MIT<\u002Fspan>\n      <span>Демо-данные на странице помечены как иллюстративные<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n\n<div class=\"page\" data-canvas-width=\"1280\" data-canvas-height=\"6400\" data-document-role=\"page\" data-label=\"Главная\">\n\n<div class=\"wrap\">\n  <header class=\"top\">\n    <a class=\"brand\" href=\"#top\" aria-label=\"Lognara, в начало страницы\">\n      <img src=\"34010ed7-b452-4189-a383-e661da24e9d9\" alt=\"\" width=\"28\" height=\"28\">\n      Lognara\n    <\u002Fa>\n    <nav class=\"nav\" aria-label=\"Основная\">\n      <a href=\"#features\">Возможности<\u002Fa>\n      <a href=\"#architecture\">Архитектура<\u002Fa>\n      <a href=\"#search\">API<\u002Fa>\n      <a href=\"#benchmarks\">Бенчмарк<\u002Fa>\n      <a href=\"#start\">Быстрый старт<\u002Fa>\n      <a href=\"#faq\">FAQ<\u002Fa>\n    <\u002Fnav>\n    <a class=\"btn ghost\" href=\"https://github.com/Liis17/Lognara\">GitHub ↗<\u002Fa>\n  <\u002Fheader>\n<\u002Fdiv>\n\n<main>\n<section class=\"hero\" id=\"top\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Open source · Rust · Self-hosted logging<\u002Fp>\n    <h1>Логи под <span style=\"color: #752323\">вашим<\u002Fspan> контролем.<\u002Fh1>\n    <p class=\"lead\">Lognara собирает события приложений, доставляет их через дисковые очереди, которые переживают перезапуски, и позволяет искать по тексту, уровню и trace ID. Всё работает на вашей инфраструктуре.<\u002Fp>\n    <div class=\"ctas\">\n      <a class=\"btn\" href=\"https://github.com/Liis17/Lognara\">Смотреть на GitHub ↗<\u002Fa>\n      <a class=\"btn ghost\" href=\"#architecture\">Как это работает<\u002Fa>\n    <\u002Fdiv>\n\n    <div class=\"pipe\" role=\"img\" aria-label=\"Путь события: приложение, Agent, Relay, Core\">\n      <div class=\"node\">\n        <b>Приложение<\u002Fb>\n        <div class=\"port\">ваш сервис<\u002Fdiv>\n        <div class=\"st\">text · json · binary<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"link\"><span class=\"pkt\"><\u002Fspan><span class=\"pkt d2\"><\u002Fspan><\u002Fdiv>\n      <div class=\"node\">\n        <b>Agent<\u002Fb>\n        <div class=\"port\">localhost · :7400<\u002Fdiv>\n        <div class=\"st\">202 · на диске<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"link\"><span class=\"pkt\"><\u002Fspan><span class=\"pkt d2\"><\u002Fspan><\u002Fdiv>\n      <div class=\"node\">\n        <b>Relay<\u002Fb>\n        <div class=\"port\">на хосте · :7401<\u002Fdiv>\n        <div class=\"st\">202 · на диске<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"link\"><span class=\"pkt\"><\u002Fspan><span class=\"pkt d2\"><\u002Fspan><\u002Fdiv>\n      <div class=\"node core\">\n        <b>Core<\u002Fb>\n        <div class=\"port\">центр · :7402<\u002Fdiv>\n        <div class=\"st\"><span style=\"color: #752323\">204 · fsync WAL<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"cap\">Agent и Relay отвечают 202, когда запись сохранена на диске этого этапа. Core отвечает 204 после fsync журнала WAL.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"wrap\">\n  <div class=\"facts\">\n    <div class=\"fact\"><span>Язык<\u002Fspan>Rust 1.94+<\u002Fdiv>\n    <div class=\"fact\"><span>Лицензия<\u002Fspan>MIT<\u002Fdiv>\n    <div class=\"fact\"><span>Внешняя БД<\u002Fspan>Не требуется<\u002Fdiv>\n    <div class=\"fact\"><span>Хранение<\u002Fspan>7 дней по умолчанию<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<section class=\"sec\" id=\"features\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Возможности<\u002Fp>\n    <h2>Доставка, которой можно доверять, и поиск, который не требует отдельной базы.<\u002Fh2>\n    <div class=\"grid3\">\n      <div class=\"cell\">\n        <div class=\"idx\">01 — Доставка<\u002Fdiv>\n        <h3>Надёжная доставка<\u002Fh3>\n        <p>Agent и Relay отвечают 202 только после записи на диск. Очереди переживают обрывы связи и перезапуски и повторяют пачки, пока Core не подтвердит приём.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cell\">\n        <div class=\"idx\">02 — Поиск<\u002Fdiv>\n        <h3>Полнотекстовый поиск<\u002Fh3>\n        <p>Tantivy индексирует текст сообщения. Фильтры по окружению, серверу, сервису, уровню и trace ID, пагинация курсором.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cell\">\n        <div class=\"idx\">03 — Хранение<\u002Fdiv>\n        <h3>Хранение для логов<\u002Fh3>\n        <p>WAL с CRC32 и SHA-256 до подтверждения. Закрытые сегменты в Parquet с ZSTD. Retention по времени поступления, 7 дней по умолчанию.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cell\">\n        <div class=\"idx\">04 — Аналитика<\u002Fdiv>\n        <h3>Гистограммы и группировки<\u002Fh3>\n        <p>Число событий по временным корзинам и group-by по одному или двум измерениям. Вычисляет DataFusion.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cell\">\n        <div class=\"idx\">05 — Trace<\u002Fdiv>\n        <h3>Логи по trace ID<\u002Fh3>\n        <p>Все события одного trace в порядке времени. Это связанные логи, а не APM-waterfall: спаны не строятся.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cell\">\n        <div class=\"idx\">06 — Лимиты<\u002Fdiv>\n        <h3>Защита от перегрузки<\u002Fh3>\n        <p>Размеры и бюджеты памяти проверяются до разбора тела. При переполнении новые запросы получают 503, а уже принятые данные не вытесняются.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"architecture\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Архитектура<\u002Fp>\n    <h2>Четыре части, один путь события.<\u002Fh2>\n    <p class=\"lead\">Agent стоит рядом с приложением, Relay работает на каждом хосте, Core — центральный сервер. Spool — общая библиотека дисковой очереди для Agent и Relay.<\u002Fp>\n    <div class=\"grid2\">\n      <div class=\"card\">\n        <div class=\"port\">localhost · :7400<\u002Fdiv>\n        <h3>Agent<\u002Fh3>\n        <p>HTTP-приём текста, JSON и бинарных данных. Добавляет service, server и backend, пакует записи в MessagePack и zstd и отправляет их в Relay.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"port\">на хосте · :7401<\u002Fdiv>\n        <h3>Relay<\u002Fh3>\n        <p>Проверяет токен, распознаёт уровень, сообщение, action и trace ID. Группирует события по источнику и держит FIFO-очередь до подтверждения Core.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"port\">центр · :7402<\u002Fdiv>\n        <h3>Core<\u002Fh3>\n        <p>WAL с fsync, сегменты Parquet с ZSTD, индекс Tantivy, каталог SQLite. Поиск, trace lookup, статистика и метрики Prometheus.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"port\">библиотека · без порта<\u002Fdiv>\n        <h3>Spool<\u002Fh3>\n        <p>Атомарные группы файлов: запись во временный каталог, fsync, rename. Порядок FIFO сохраняется, повреждённые данные не пропускаются молча.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"acks\">\n      <div class=\"ack\">\n        <div class=\"code\">202<\u002Fdiv>\n        <p><strong>Agent или Relay записали данные на диск.<\u002Fstrong> Это подтверждение этапа, а не появление записи в поиске.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ack\">\n        <div class=\"code\">204<\u002Fdiv>\n        <p><strong>Core синхронизировал WAL (fsync).<\u002Fstrong> Запись надёжно сохранена на центральном сервере.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ack\">\n        <div class=\"code\">1 с<\u002Fdiv>\n        <p><strong>Видимость в поиске.<\u002Fstrong> Запись появляется после публикации снимка Core. Стандартный интервал обновления — 1000 мс.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"events\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Структура события<\u002Fp>\n    <h2>Ваш JSON становится структурированным событием.<\u002Fh2>\n    <p class=\"lead\">Agent не меняет смысл записи. Relay извлекает известные поля, а остальные сохраняет целиком в attributes.<\u002Fp>\n    <div class=\"split\">\n      <div>\n        <div class=\"label\">Вход · JSON от приложения<\u002Fdiv>\n        <pre class=\"code\"><span class=\"c\">POST /v1/logs<\u002Fspan>\n{\n  \"level\": <span class=\"s\">\"error\"<\u002Fspan>,\n  \"message\": <span class=\"s\">\"Failed to save file metadata\"<\u002Fspan>,\n  \"action\": <span class=\"s\">\"file.upload\"<\u002Fspan>,\n  \"trace_id\": <span class=\"s\">\"8c21f0a4b6c8d0e12a4b6c8d0e1f3a5b\"<\u002Fspan>,\n  \"filename\": <span class=\"s\">\"cat.png\"<\u002Fspan>,\n  \"user_id\": <span class=\"k\">18271<\u002Fspan>\n}<\u002Fpre>\n      <\u002Fdiv>\n      <div>\n        <div class=\"label\">Событие в Core · пример<\u002Fdiv>\n        <dl class=\"kv\">\n          <dt>timestamp<\u002Fdt><dd>2026-09-29T10:41:51.871Z<\u002Fdd>\n          <dt>environment<\u002Fdt><dd>production<\u002Fdd>\n          <dt>server<\u002Fdt><dd>eu-prod-01<\u002Fdd>\n          <dt>backend<\u002Fdt><dd>demo<\u002Fdd>\n          <dt>service<\u002Fdt><dd>files<\u002Fdd>\n          <dt>level<\u002Fdt><dd><span class=\"pill\">error<\u002Fspan><\u002Fdd>\n          <dt>action<\u002Fdt><dd>file.upload<\u002Fdd>\n          <dt>trace_id<\u002Fdt><dd>8c21f0a4b6c8d0e12a4b6c8d0e1f3a5b<\u002Fdd>\n          <dt>message<\u002Fdt><dd>Failed to save file metadata<\u002Fdd>\n          <dt>attributes<\u002Fdt><dd>filename, user_id<\u002Fdd>\n        <\u002Fdl>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"note\">Иллюстративный пример, не результат живого запроса. Поля server, backend и service задаёт Agent из своей конфигурации.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"search\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Поиск и статистика<\u002Fp>\n    <h2>Работающий HTTP API для поиска и аналитики.<\u002Fh2>\n    <p class=\"lead\">Веб-консоли в репозитории пока нет. Уже работают эндпоинты, которые можно использовать в своих инструментах.<\u002Fp>\n    <div class=\"split\">\n      <div class=\"eps\">\n        <div class=\"ep\">\n          <div class=\"path\"><span class=\"m\">POST<\u002Fspan>/v1/logs/search<\u002Fdiv>\n          <p>Фильтры по полям, полнотекстовый поиск по message, курсорная пагинация.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ep\">\n          <div class=\"path\"><span class=\"m\">GET<\u002Fspan>/v1/traces/{trace_id}<\u002Fdiv>\n          <p>Все события одного trace в порядке времени.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ep\">\n          <div class=\"path\"><span class=\"m\">POST<\u002Fspan>/v1/stats/histogram<\u002Fdiv>\n          <p>Число событий по временным корзинам, от 1 секунды до суток.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ep\">\n          <div class=\"path\"><span class=\"m\">POST<\u002Fspan>/v1/stats/group-by<\u002Fdiv>\n          <p>Группировка по одному или двум полям: сервис, сервер, уровень и другие.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ep\">\n          <div class=\"path\"><span class=\"m\">GET<\u002Fspan>/metrics<\u002Fdiv>\n          <p>Метрики Core в формате Prometheus. Доступ по токену.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"label\">Пример · POST /v1/logs/search<\u002Fdiv>\n        <pre class=\"code\"><span class=\"c\">Authorization: Bearer &lt;QUERY_TOKEN&gt;<\u002Fspan>\n{\n  \"from\": <span class=\"s\">\"2026-09-29T10:00:00Z\"<\u002Fspan>,\n  \"to\": <span class=\"s\">\"2026-09-29T11:00:00Z\"<\u002Fspan>,\n  \"filters\": {\n    \"service\": [<span class=\"s\">\"files\"<\u002Fspan>, <span class=\"s\">\"api\"<\u002Fspan>],\n    \"level\": [<span class=\"s\">\"error\"<\u002Fspan>, <span class=\"s\">\"warn\"<\u002Fspan>]\n  },\n  \"text\": { \"query\": <span class=\"s\">\"connection refused\"<\u002Fspan>, \"mode\": <span class=\"s\">\"phrase\"<\u002Fspan> },\n  \"limit\": <span class=\"k\">100<\u002Fspan>\n}<\u002Fpre>\n        <p class=\"note\">Полнотекстово индексируется message. Поля attributes в фильтрах пока не участвуют.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec inv\" id=\"benchmarks\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Бенчмарк · 30 сентября 2026<\u002Fp>\n    <h2>Цифры из реального прогона.<\u002Fh2>\n    <p class=\"lead\">30-минутная синтетическая нагрузка. Генератор и Core работали на одной машине.<\u002Fp>\n    <div class=\"stats\">\n      <div class=\"stat\"><div class=\"n\">18,0 млн<\u002Fdiv><div class=\"t\">событий принято и найдено после перезапуска, без ошибок в сценарии<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"n\">10 000<\u002Fdiv><div class=\"t\">событий в секунду, среднее за 30 минут<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"n\">21 мс<\u002Fdiv><div class=\"t\">p99 подтверждения ACK от Core<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"n\">1,28 с<\u002Fdiv><div class=\"t\">p99 от ACK до появления в поиске<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"note\">macOS arm64 · 10 логических CPU · 16 GiB RAM · локальный SSD · release core v1. Пиковая память Core составила 426 MiB, поиск p99 — 39 мс. Это не гарантия для другого железа: целевой сценарий 4 CPU / 8 GiB пока не проверен на Linux-сервере. <a href=\"https://github.com/Liis17/Lognara/blob/master/Lognara-core/docs/benchmark-results.md\">Полный отчёт ↗<\u002Fa><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"start\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Быстрый старт<\u002Fp>\n    <h2>Запуск из исходников за три шага.<\u002Fh2>\n    <p class=\"lead\">Готовых Docker-образов в текущей версии нет. Нужен Rust 1.94+.<\u002Fp>\n    <div class=\"steps\">\n      <div class=\"step\">\n        <div class=\"head\"><span class=\"num\">01<\u002Fspan><h3>Соберите бинарники<\u002Fh3><\u002Fdiv>\n        <pre class=\"code\"><span class=\"c\"># из корня репозитория<\u002Fspan>\ncargo build --release --manifest-path Lognara-core/Cargo.toml --bin lognara-core\ncargo build --release --manifest-path Lognara-relay/Cargo.toml\ncargo build --release --manifest-path Lognara-agent/Cargo.toml<\u002Fpre>\n      <\u002Fdiv>\n      <div class=\"step\">\n        <div class=\"head\"><span class=\"num\">02<\u002Fspan><h3>Запустите Core, Relay и Agent<\u002Fh3><\u002Fdiv>\n        <pre class=\"code\"><span class=\"c\"># Core<\u002Fspan>\nLOGNARA_INGEST_TOKEN=ingest-secret LOGNARA_QUERY_TOKEN=query-secret \\\nLOGNARA_DATA_DIR=/tmp/lognara-demo/core Lognara-core/target/release/lognara-core\n\n<span class=\"c\"># Relay<\u002Fspan>\nLOGNARA_CORE_URL=http://127.0.0.1:7402/v1/batches LOGNARA_CORE_TOKEN=ingest-secret \\\nLOGNARA_RELAY_TOKEN=relay-secret LOGNARA_SPOOL_DIR=/tmp/lognara-demo/relay-spool \\\nLOGNARA_FLUSH_INTERVAL_MS=1000 Lognara-relay/target/release/lognara-relay\n\n<span class=\"c\"># Agent<\u002Fspan>\nLOGNARA_SERVICE=api LOGNARA_SERVER=local LOGNARA_BACKEND=demo LOGNARA_RELAY_TOKEN=relay-secret \\\nLOGNARA_RELAY_URL=http://127.0.0.1:7401/v1/batches LOGNARA_SPOOL_DIR=/tmp/lognara-demo/agent-spool \\\nLOGNARA_FLUSH_INTERVAL_MS=1000 Lognara-agent/target/release/lognara-agent<\u002Fpre>\n      <\u002Fdiv>\n      <div class=\"step\">\n        <div class=\"head\"><span class=\"num\">03<\u002Fspan><h3>Отправьте лог и найдите его<\u002Fh3><\u002Fdiv>\n        <pre class=\"code\"><span class=\"c\"># отправить в Agent<\u002Fspan>\ncurl -X POST http://127.0.0.1:7400/v1/logs \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"level\":\"error\",\"message\":\"connection refused\",\"action\":\"db.connect\"}'\n\n<span class=\"c\"># найти в Core<\u002Fspan>\ncurl -X POST http://127.0.0.1:7402/v1/logs/search \\\n  -H 'Authorization: Bearer query-secret' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"from\":\"2020-01-01T00:00:00Z\",\"to\":\"2100-01-01T00:00:00Z\",\"filters\":{\"level\":[\"error\"]},\"text\":{\"query\":\"connection refused\",\"mode\":\"phrase\"}}'<\u002Fpre>\n        <p class=\"note\">Токены в примере демонстрационные. Для внешнего HTTP поставьте TLS-прокси, например nginx.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"faq\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">FAQ<\u002Fp>\n    <h2>Вопросы, которые задают чаще всего.<\u002Fh2>\n    <div class=\"faq\">\n      <details>\n        <summary>Lognara — это облачный сервис?<\u002Fsummary>\n        <p class=\"ans\">Нет. Это набор сервисов, которые вы запускаете сами. Личного кабинета, SaaS и управляемого хостинга в проекте нет.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Гарантирует ли Lognara отсутствие потерь?<\u002Fsummary>\n        <p class=\"ans\">Нет. Гарантия относится к запросам, подтверждённым на исправном диске. Доставка работает по схеме at-least-once: повторы возможны. Неподтверждённый запрос приложение должно повторить само.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Что будет, если Core недоступен?<\u002Fsummary>\n        <p class=\"ans\">Relay сохраняет подтверждённые пачки на диске и повторит доставку после восстановления связи. Если очередь заполнится, новые запросы получат 503, и клиент должен отправить их снова.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Есть ли веб-интерфейс?<\u002Fsummary>\n        <p class=\"ans\">Пока нет. В репозитории есть HTTP API для поиска, трассировок и статистики. Браузерная консоль потребует отдельного защищённого бэкенда и будет отдельной задачей.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Нужна ли внешняя база данных?<\u002Fsummary>\n        <p class=\"ans\">Нет. Используются локальные Parquet-сегменты, индекс Tantivy и SQLite-каталог. Нужен надёжный локальный диск.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Можно ли искать по полям attributes?<\u002Fsummary>\n        <p class=\"ans\">Нет. Attributes сохраняются и возвращаются в событиях, но в текущей версии не индексируются.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Есть ли готовый Docker-образ?<\u002Fsummary>\n        <p class=\"ans\">В версии 0.1.0 Dockerfile и опубликованных образов нет. Сервисы собираются из исходников на Rust.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Какая лицензия?<\u002Fsummary>\n        <p class=\"ans\">MIT. Исходники открыты, их можно изучить, менять и использовать.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n\n<footer class=\"foot\">\n  <div class=\"wrap\">\n    <img src=\"34010ed7-b452-4189-a383-e661da24e9d9\" alt=\"\" width=\"56\" height=\"56\" style=\"border-radius:14px\">\n    <p class=\"close\" style=\"margin-top:32px\">Логи под вашим контролем.<\u002Fp>\n    <div class=\"ctas\">\n      <a class=\"btn\" href=\"https://github.com/Liis17/Lognara\">Открыть на GitHub ↗<\u002Fa>\n      <a class=\"btn ghost\" href=\"https://github.com/Liis17/Lognara#readme\">README ↗<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"links\">\n      <a href=\"https://github.com/Liis17/Lognara/blob/master/Lognara-core/README.md\">Документация Core ↗<\u002Fa>\n      <a href=\"https://github.com/Liis17/Lognara/blob/master/Lognara-core/docs/benchmark-results.md\">Отчёт о бенчмарке ↗<\u002Fa>\n      <a href=\"https://github.com/Liis17/Lognara/blob/master/LICENSE\">Лицензия MIT ↗<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"legal\">\n      <span>Lognara v0.1.0 · Rust · MIT<\u002Fspan>\n      <span>Демо-данные на странице помечены как иллюстративные<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#752323&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:6400}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn { accent: this.props.accent ?? '#752323' };\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
